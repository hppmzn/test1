name: CI Gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write
  security-events: write

jobs:
  detect:
    name: Detect stack
    runs-on: ubuntu-latest
    outputs:
      has_dotnet: ${{ steps.detect.outputs.has_dotnet }}
      has_node: ${{ steps.detect.outputs.has_node }}
      has_iac: ${{ steps.detect.outputs.has_iac }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect project files
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob

          dotnet_files=(**/*.sln **/*.csproj)
          node_files=(**/package.json)
          iac_files=(**/*.bicep **/*.tf)

          echo "has_dotnet=$([[ ${#dotnet_files[@]} -gt 0 ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "has_node=$([[ ${#node_files[@]} -gt 0 ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "has_iac=$([[ ${#iac_files[@]} -gt 0 ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  build_test_dotnet:
    name: Build/Test (.NET)
    needs: detect
    if: needs.detect.outputs.has_dotnet == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release

  build_test_node:
    name: Build/Test (Node)
    needs: detect
    if: needs.detect.outputs.has_node == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build --if-present

      - name: Test
        run: npm test --if-present

  security_and_secrets:
    name: Security/Secret Scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Secret scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  iac_validate:
    name: IaC Validation
    needs: detect
    if: needs.detect.outputs.has_iac == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Validate Bicep templates
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          for file in **/*.bicep; do
            az bicep build --file "$file"
          done
